
<section class="Texto1">
    <h2>Encontre o que você precisa</h2>
    <p>Selecione os filtros abaixo para encontrar os melhores estabelecimentos em sua região:</p>
</section> 

<form [formGroup]="buscaForm" (ngSubmit)="onBuscar()">
    <div class="form-group">
        <label for="serviceType">Tipo estabelecimento:</label>
        <select formControlName="serviceType" required>
            <option value="">Selecione...</option>
            <option value="bar">Bares</option>
            <option value="restaurant">Restaurantes</option>
            <option value="park">Parques</option>
            <option value="library">Bibliotecas</option>
            <option value="tourist_attraction">Turismo</option>
            <option value="point_of_interest">Outros</option>
        </select>
    </div>

    <div class="form-group">
        <label for="state">Estado:</label>
        <select formControlName="state" required>
            <option value="">Selecione...</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espírito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>

        </select>
    </div>

    <div class="form-group">
        <label for="city">Cidade:</label>
        <input type="text" formControlName="city" placeholder="Ex: São Paulo" required>
    </div>

    <div class="form-group">
        <label for="neighborhood">Bairro:</label>
        <input type="text" formControlName="neighborhood" placeholder="Ex: Vila Mariana">
    </div>

    <div class="form-group">
        <label for="rating">Avaliação:</label>
        <select formControlName="rating" required>
            <option value="">Selecione...</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
    </div>
    <div class="form-group">
        <button type="submit">Buscar</button>
    </div>
</form>

<div id="results" class="result">
    <h3>Resultados</h3>
    <!--
    <ul>
        <li *ngFor="let lugar of resultados">
            {{ lugar.name }} - Nota: {{ lugar.rating }}
        </li>
    </ul>
    -->

    <table class="tResultado">
        <thead>
            <tr>
                <th>Nome do Lugar</th>
                <th>Nota</th>
                <th>Quantidade de Avaliações</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let lugar of resultados">
                <td>{{ lugar.name }}</td>
                <td>{{ lugar.rating }}</td>
                <td>{{ lugar.user_ratings_total }}</td>
    
            </tr>
        </tbody>
    </table>


</div>
